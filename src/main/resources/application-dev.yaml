spring:
  application:
    name: Booking-Management-App-Dev
  datasource:
    url: jdbc:postgresql://localhost:5432/reservation-system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms
      lettuce:
        shutdown-timeout: 100ms

  mail:
    host: smtp.mailtrap.io
    port: 587
    username: ${MAILTRAP_USERNAME}
    password: ${MAILTRAP_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  base-url: http://localhost:3000
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 86400
    refresh-expiration: 604800
  stripe:
    api-key: ${STRIPE_API_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true

  springdoc:
    swagger-ui:
      enabled: true
      try-it-out-enabled: true
      persistAuthorization: true
    api-docs:
      enabled: true
    info:
      title: Portfolio API - DEV
      version: 1.0.0
      description: API Documentation (Development Environment)
      contact:
        name: Axel Constantino Olvera
        email: constantinoolveraa@gmail.com

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    com.axconstantino.reservationsystem: debug