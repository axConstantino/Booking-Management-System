spring:
  application:
    name: Booking-Management-App-Test
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      use-new-id-generator-mappings: true
  jackson:
    serialization:
      INDENT_OUTPUT: true
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:tc:postgresql:16:///testdb?TC_TMPFS=/testtmpfs:rw
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 2000
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        jdbc:
          batch_size: 20
        query:
          in_clause_parameter_padding: true
  sql:
    init:
      mode: always

  data:
    redis:
      database: 1
      lettuce:
        shutdown-timeout: 100ms

  mail:
    host: localhost
    port: 1025
    protocol: smtp
    test-connection: false
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 2000
          timeout: 2000

  springdoc:
    swagger-ui:
      enabled: true
      try-it-out-enabled: false
    api-docs:
      enabled: true
    info:
      title: BookingManagementSystem API - TEST
      version: 1.0.0
      description: API Documentation (Test Environment)


  server:
    port: 8080
    error:
      include-message: always
      include-binding-errors: always
    servlet:
      context-path: /

app:
  base-url: http://localhost:8080
  security:
    jwt:
      secret: 
      access-expiration: 600000
      refresh-expiration: 1800000
    token:
      password-reset: 
  payments:
    stripe:
      test-mode: true
      #secure key for testing only
      api-key:  sk_test_51RHunaFPdYwjau3zeHHNeX4KYO8Nb4IFki1tQ830fwq9bU7LJdpqxwTDONbMqgEUpckehcaUInYu7ObyRqDM6U3e00o8AhQt6N
      webhook-secret: whsec_cb8141b65c35b0771ebb56649dc3f9a6231f3e2fee9a9ec9d4f211b3354cdfbc
  cloud:
    cloudinary:
      cloud-name: cloudinary
      api-key: api-key-cloudinary
      api-secret: api-secret-cloudinary

logging:
  level:
    root: INFO
    org.springframework: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.testcontainers: INFO
    com.axconstantino.reservationsystem: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

testcontainers:
  reuse:
    enabled: true